# Build Flutter web and deploy to GitHub Pages.
# Push to main → site updates at https://<owner>.github.io/<repo>/ and your custom domain (if set).

name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: stable
          cache: true

      - name: Verify Dart and pubspec SDK
        run: |
          flutter --version
          echo "--- pubspec environment (must be >=3.3.0 for Dart 3.3.4) ---"
          grep -A1 "^environment:" pubspec.yaml

      # Ensure only environment.sdk is set for Dart 3.3.4 (do not touch dependencies' sdk: flutter)
      - name: Set pubspec SDK for CI
        run: |
          python3 << 'PY'
          with open("pubspec.yaml", "r") as f:
            lines = f.readlines()
          in_env = False
          out = []
          for line in lines:
            if line.strip() == "environment:":
              in_env = True
              out.append(line)
              continue
            if in_env and line.strip().startswith("sdk:"):
              out.append('  sdk: ">=3.3.0 <4.0.0"\n')
              in_env = False
              continue
            if in_env and line and not line[0].isspace() and line.strip():
              in_env = False
            out.append(line)
          with open("pubspec.yaml", "w") as f:
            f.writelines(out)
          PY
          # Fix pubspec.lock sdks so it accepts Dart 3.3.4
          sed -i.bak 's/dart: ">=3\.9\.0/dart: ">=3.3.0/' pubspec.lock 2>/dev/null || true
          sed -i.bak 's/flutter: ">=3\.35\./flutter: ">=3.19./' pubspec.lock 2>/dev/null || true
          echo "--- pubspec after CI fix ---"
          grep -A1 "^environment:" pubspec.yaml
          echo "--- pubspec.lock sdks ---"
          grep -A2 "^sdks:" pubspec.lock 2>/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web \
            --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      # SPA: serve index.html for unknown paths (so client-side routes work on refresh/direct links)
      - name: Add 404.html for SPA routing
        run: cp build/web/index.html build/web/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
